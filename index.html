<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1630">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ねむログ — 睡眠記録アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--panel:#fff;--text:#14203a;--sub:#5b6a86;--line:#d5deec;--accent:#3f5bd1;--warm:#b8741a;--bar:#9fb2ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1630;--panel:#16213f;--text:#e4ebf8;--sub:#93a3c4;--line:#2a3860;--accent:#8fa5ff;--warm:#f0b35c;--bar:#3a4f93;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1630;--panel:#16213f;--text:#e4ebf8;--sub:#93a3c4;--line:#2a3860;--accent:#8fa5ff;--warm:#f0b35c;--bar:#3a4f93;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.7}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.15rem;margin:0 0 16px;font-weight:700}
section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h2{font-size:.95rem;margin:0 0 12px;font-weight:700}
.hero{text-align:center}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:2.3rem;font-weight:700;line-height:1.1}
.sub{color:var(--sub);font-size:.85rem}
.row{display:flex;gap:10px}
.row>label{flex:1}
label{display:block;font-size:.85rem;color:var(--sub)}
input[type=time],input[type=number]{width:100%;margin-top:4px;padding:10px;font:inherit;font-size:1.05rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px}
.q{display:flex;gap:6px;margin:12px 0}
.q button{flex:1;padding:10px 0;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;cursor:pointer}
.q button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.go{width:100%;padding:12px;font:inherit;font-weight:700;border:0;border-radius:14px;background:var(--accent);color:var(--bg);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;position:relative;border-bottom:1px solid var(--line)}
.bars .g{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warm)}
.bars .b{flex:1;background:var(--bar);border-radius:8px 8px 0 0;min-height:2px;position:relative}
.bars .b.ok{background:var(--accent)}
.days{display:flex;gap:8px;font-size:.75rem;color:var(--sub);text-align:center}
.days span{flex:1}
.times{display:flex;gap:8px;margin-top:12px}
.times div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 0}
.times b{display:block;font-size:1.1rem}
.list{list-style:none;margin:0;padding:0;font-size:.9rem}
.list li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.list button{border:0;background:none;color:var(--sub);cursor:pointer;font:inherit}
.hyp{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dashoffset .8s ease}}
</style>
</head>
<body>
<main>
<h1>ねむログ</h1>

<section class="hero" aria-live="polite">
  <div class="ring">
    <svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
      <circle cx="90" cy="90" r="76" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle class="v" id="arc" cx="90" cy="90" r="76" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="477.5"/>
    </svg>
    <div class="c"><div class="big" id="last">--</div><div class="sub" id="lastsub">昨夜の記録なし</div></div>
  </div>
  <p class="sub" id="debt" style="margin:12px 0 0"></p>
</section>

<section>
  <h2>スマホで睡眠を計測</h2>
  <p class="sub" style="margin:0 0 12px">スマホをマットレスの上に置き、充電しながら使ってください。Chromeで開き、計測中は画面を点けたままにします(画面を暗くするのは問題ありません)。</p>
  <button class="go" id="meas">計測を開始</button>
  <p class="sub" id="mstat" aria-live="polite" style="margin:10px 0 0"></p>
</section>

<section>
  <h2>昨夜の睡眠を記録</h2>
  <div class="row">
    <label>就寝<input type="time" id="bed" value="23:30"></label>
    <label>起床<input type="time" id="wake" value="07:00"></label>
  </div>
  <div class="sub" style="margin-top:10px">目覚めの質</div>
  <div class="q" id="q"></div>
  <button class="go" id="save">記録を保存</button>
</section>

<section>
  <h2>睡眠ステージ(推定)</h2>
  <div id="hyp"></div>
  <p class="sub" id="hypnote" style="margin:10px 0 0">センサーを使わず、就寝・起床時刻から90分周期のモデルで推定した目安です。実測値ではありません。</p>
</section>

<section>
  <h2>直近7日の睡眠時間</h2>
  <div class="bars" id="bars"></div>
  <div class="days" id="days"></div>
  <p class="sub" id="avg" style="margin:10px 0 0"></p>
</section>

<section>
  <h2>起きたい時刻から逆算</h2>
  <label>起床時刻<input type="time" id="target" value="07:00"></label>
  <div class="times" id="calc"></div>
  <p class="sub" style="margin:10px 0 0">睡眠サイクル90分と入眠までの15分で計算しています。</p>
</section>

<section>
  <h2>目標</h2>
  <label>睡眠目標(時間)<input type="number" id="goal" min="4" max="12" step="0.5" value="7.5"></label>
</section>

<section>
  <h2>記録一覧</h2>
  <ul class="list" id="list"></ul>
</section>
</main>

<script>
const KEY="nemulog-v1";
let st={logs:[],goal:7.5};
try{const r=localStorage.getItem(KEY);if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
const QL=["最悪","いまいち","ふつう","良い","最高"];
let quality=3;

function mins(t){const[a,b]=t.split(":").map(Number);return a*60+b}
function dur(bed,wake){let d=mins(wake)-mins(bed);if(d<=0)d+=1440;return d}
function fmt(m){return Math.floor(m/60)+"時間"+String(m%60).padStart(2,"0")+"分"}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}

$("q").innerHTML=QL.map((l,i)=>`<button type="button" data-q="${i+1}" aria-pressed="${i+1===quality}">${l}</button>`).join("");
$("q").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;quality=+b.dataset.q;[...$("q").children].forEach(x=>x.setAttribute("aria-pressed",x===b))});

$("save").onclick=()=>{
  const date=ds(new Date());
  const d=dur($("bed").value,$("wake").value);
  st.logs=st.logs.filter(l=>l.date!==date);
  st.logs.push({date,bed:$("bed").value,wake:$("wake").value,q:quality,d});
  st.logs.sort((a,b)=>a.date<b.date?1:-1);
  persist();render();
  $("save").textContent="保存しました";setTimeout(()=>$("save").textContent="記録を保存",1500);
};
$("goal").onchange=()=>{const v=parseFloat($("goal").value);if(v>=4&&v<=12){st.goal=v;persist();render()}};
$("target").oninput=calc;
$("list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.logs=st.logs.filter(l=>l.date!==b.dataset.d);persist();render()});

function calc(){
  const w=mins($("target").value);
  $("calc").innerHTML=[6,5,4].map(n=>`<div><b>${hm(w-n*90-15)}</b><span class="sub">${n}サイクル<br>${n*1.5}時間</span></div>`).join("");
}

function render(){
  $("goal").value=st.goal;
  const goalM=st.goal*60;
  const today=ds(new Date());
  const last=st.logs[0];
  if(last){
    $("last").textContent=(last.d/60).toFixed(1)+"h";
    $("lastsub").textContent=last.date===today?"今朝の記録":last.date+" の記録";
    $("arc").style.strokeDashoffset=477.5*(1-Math.min(1,last.d/goalM));
    const diff=last.d-goalM;
    $("debt").textContent=diff>=0?"目標を達成しています。":"目標まであと"+fmt(Math.round(-diff))+"。";
  }else{
    $("last").textContent="--";$("lastsub").textContent="記録がまだありません";
    $("arc").style.strokeDashoffset=477.5;$("debt").textContent="下のフォームから最初の記録を保存しましょう。";
  }
  const bars=$("bars"),days=$("days");
  bars.innerHTML='<div class="g" style="bottom:'+Math.min(100,goalM/600*100)+'%"></div>';
  days.innerHTML="";
  let sum=0,n=0;
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const l=st.logs.find(x=>x.date===ds(d));
    const h=l?Math.min(100,l.d/600*100):0;
    if(l){sum+=l.d;n++}
    bars.insertAdjacentHTML("beforeend",`<div class="b${l&&l.d>=goalM?" ok":""}" style="height:${h}%" title="${l?fmt(l.d):"記録なし"}"></div>`);
    days.insertAdjacentHTML("beforeend",`<span>${d.getMonth()+1}/${d.getDate()}</span>`);
  }
  $("avg").textContent=n?"7日間の平均は"+fmt(Math.round(sum/n))+"です(破線が目標)。":"記録すると平均が表示されます。";
  hyp();
  $("list").innerHTML=st.logs.slice(0,14).map(l=>`<li><span>${l.date.slice(5)}  ${l.bed}→${l.wake}(${fmt(l.d)}・${QL[l.q-1]})</span><button data-d="${l.date}" aria-label="${l.date}の記録を削除">削除</button></li>`).join("")||'<li class="sub">まだありません</li>';
}
let M=null;
function fmtT(s){return Math.floor(s/3600)+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tick(){
  const s=Math.floor((Date.now()-M.start)/1000);
  while(M.ep.length<Math.floor(s/60)){M.ep.push(+M.acc.toFixed(2));M.acc=0}
  if(s>=4&&!M.seen){endMeas(false,"加速度センサーの値を取得できませんでした。公開リンクをChromeで直接開いて試してください。");return}
  $("mstat").textContent="計測中 "+fmtT(s)+"(スマホを動かさず、そのまま寝てください)";
}
async function lockScreen(){try{M.lock=await navigator.wakeLock.request("screen")}catch(e){}}
function endMeas(save,msg){
  const m=M;M=null;
  clearInterval(m.timer);window.removeEventListener("devicemotion",m.h);document.removeEventListener("visibilitychange",m.vh);
  try{m.lock&&m.lock.release()}catch(e){}
  $("meas").textContent="計測を開始";
  if(save&&m.ep.length>=10){
    const date=ds(new Date()),b=m.start;
    st.logs=st.logs.filter(l=>l.date!==date);
    st.logs.push({date,bed:hm(b.getHours()*60+b.getMinutes()),wake:hm(new Date().getHours()*60+new Date().getMinutes()),q:quality,d:m.ep.length,ep:m.ep});
    st.logs.sort((a,b)=>a.date<b.date?1:-1);
    persist();render();
    $("mstat").textContent="計測を保存しました("+fmt(m.ep.length)+")。";
  }else{$("mstat").textContent=msg||"10分未満のため保存しませんでした。"}
}
$("meas").onclick=async()=>{
  if(M){endMeas(true);return}
  if(!window.DeviceMotionEvent){$("mstat").textContent="このブラウザは加速度センサーに対応していません。";return}
  M={start:Date.now(),ep:[],acc:0,p:null,seen:false,lock:null};
  M.start=new Date();
  M.h=e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;M.seen=true;if(M.p){const d=Math.abs(a.x-M.p[0])+Math.abs(a.y-M.p[1])+Math.abs(a.z-M.p[2]);if(d>0.08)M.acc+=d-0.08}M.p=[a.x,a.y,a.z]};
  M.vh=()=>{if(document.visibilityState==="visible"&&M&&(!M.lock||M.lock.released))lockScreen()};
  window.addEventListener("devicemotion",M.h);
  document.addEventListener("visibilitychange",M.vh);
  await lockScreen();
  $("meas").textContent="計測を終了して保存";
  M.timer=setInterval(tick,1000);tick();
};
function stageAt(m){const k=Math.floor(m/90),r=m%90,dp=Math.max(0,34-9*k),rem=Math.min(40,8+9*k),li=90-dp-rem;return r<li*.4?2:r<li*.4+dp?3:r<li?2:1}
function modelSeg(total){
  const seg=[];let t=0;
  const push=(s,m)=>{m=Math.min(m,total-t);if(m>0){seg.push([s,m,t]);t+=m}};
  push(0,total>60?15:0);
  for(let k=0;t<total;k++){const dp=Math.max(0,34-9*k),rem=Math.min(40,8+9*k),li=90-dp-rem;push(2,li*.4);push(3,dp);push(2,li*.6);push(1,rem)}
  return seg;
}
function segFromEp(ep){
  const n=ep.length;
  const w=ep.map((_,i)=>{let s=0,c=0;for(let j=i-2;j<=i+2;j++)if(j>=0&&j<n){s+=ep[j];c++}return s/c});
  const wk=ep.map((v,i)=>v>3||w[i]>1.5);
  let on=n;for(let i=0;i+10<=n;i++){if(!wk.slice(i,i+10).some(Boolean)){on=i;break}}
  const seg=[];
  for(let i=0;i<n;i++){
    let s=0;
    if(i>=on&&!wk[i]){s=stageAt(i-on);if(w[i]>0.3&&(s===1||s===3))s=2}
    const last=seg[seg.length-1];
    if(last&&last[0]===s)last[1]++;else seg.push([s,1,i]);
  }
  return seg;
}
function hyp(){
  const el=$("hyp"),l=st.logs[0];
  if(!l){el.innerHTML='<p class="sub">記録を保存すると、ここにグラフが表示されます。</p>';return}
  const total=l.ep?l.ep.length:l.d,seg=l.ep?segFromEp(l.ep):modelSeg(l.d);
  const names=["覚醒","レム","浅い","深い"],cols=["var(--warm)","#d46a9a","var(--bar)","var(--accent)"];
  const W=320,L=44,R=6,RH=28,top=4,xs=m=>L+m/total*(W-L-R);
  const sum=[0,0,0,0];seg.forEach(s=>sum[s[0]]+=s[1]);
  const order=[0,1,2,3];
  let svg=`<svg class="hyp" viewBox="0 0 ${W} ${top+RH*4+18}" role="img" aria-label="睡眠ステージの推定グラフ">`;
  order.forEach((r,i)=>{
    svg+=`<line x1="${L}" x2="${W-R}" y1="${top+i*RH+RH/2}" y2="${top+i*RH+RH/2}" stroke="var(--line)" stroke-width="1"/>`;
    svg+=`<text x="0" y="${top+i*RH+RH/2+4}" font-size="11" fill="var(--sub)">${names[r]}</text>`;
  });
  seg.forEach(([s,m,st0])=>{
    svg+=`<rect x="${xs(st0).toFixed(1)}" y="${top+s*RH+4}" width="${Math.max(1,xs(st0+m)-xs(st0)).toFixed(1)}" height="${RH-8}" rx="4" fill="${cols[s]}"/>`;
  });
  const b=mins(l.bed),ay=top+RH*4+13;
  for(let h=0;h*60<=total;h++){svg+=`<text x="${xs(h*60).toFixed(1)}" y="${ay}" font-size="9" fill="var(--sub)" text-anchor="${h===0?"start":"middle"}">${hm(b+h*60)}</text>`}
  svg+="</svg>";
  const asleep=total-sum[0];
  const lg=[1,2,3].map(i=>`<span><i style="background:${cols[i]}"></i>${names[i]} ${fmt(Math.round(sum[i]))}(${Math.round(sum[i]/asleep*100)}%)</span>`).join("");
  el.innerHTML=svg+`<div class="legend">${lg}</div>`;
  $("hypnote").textContent=l.ep?"スマホの体動と睡眠サイクルのモデルから推定した目安です。覚醒は実際の体動、レム・深い睡眠は推定値です。":"手入力の時刻から90分周期のモデルで推定した目安です。実測値ではありません。";
}
calc();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
